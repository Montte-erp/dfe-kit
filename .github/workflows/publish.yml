name: Publish

on:
  push:
    branches: [master]
    paths:
      - "packages/**/package.json"
      - "packages/**/CHANGELOG.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish without uploading to npm"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      CI: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Bun & Nx Setup
        uses: ./.github/actions/setup-bun-nx

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Run checks
        run: bun run check

      - name: Run publint
        run: bun run publint

      - name: Verify trusted publishing context
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "Missing GitHub OIDC request URL. Keep permissions.id-token: write enabled for npm trusted publishing." >&2
            exit 1
          fi

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: bun run publish:npm:dry

      - name: Publish to npm
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: bun run publish:npm
