name: Publish

on:
  push:
    branches: [master]
    paths:
      - "packages/**/package.json"
      - "packages/**/CHANGELOG.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish without uploading to npm"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      CI: "false"
      GITHUB_ACTIONS: "false"
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Bun & Nx Setup
        uses: ./.github/actions/setup-bun-nx

      - name: Run checks
        run: bun run check

      - name: Run publint
        run: bun run publint

      - name: Validate npm auth
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing npm token. Configure one of these repository/environment secrets: NPM_TOKEN, NODE_AUTH_TOKEN, or NPM_AUTH_TOKEN." >&2
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org/

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: bun run publish:npm:dry

      - name: Publish to npm
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: bun run publish:npm
